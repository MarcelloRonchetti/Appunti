<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Appunti di storia, italiano ed educazione civica organizzati per argomento."
    />
    <title>Appunti Sto-Ita</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <p class="eyebrow">Archivio di studio</p>
        <h1>Appunti Sto-Ita</h1>
        <p class="hero-text">
          Storia, italiano ed educazione civica in pagine separate, senza
          pubblicare le fonti originali.
        </p>
      </header>

      <main class="layout">
        <aside class="sidebar" aria-label="Navigazione degli appunti">
          <div class="search-box">
            <label for="search">Cerca negli argomenti</label>
            <input
              id="search"
              type="search"
              placeholder="Es. fascismo, Svevo, Europa..."
              autocomplete="off"
            />
          </div>
          <nav id="navigation" class="navigation"></nav>
        </aside>

        <article class="reader" aria-live="polite">
          <div id="reader-meta" class="reader-meta"></div>
          <div id="content" class="content">
            <noscript>
              Per leggere gli appunti serve JavaScript: il sito carica i file
              Markdown e li trasforma in pagine navigabili.
            </noscript>
          </div>
        </article>
      </main>
    </div>

    <script src="assets/app.js" defer></script>
  </body>
</html>
